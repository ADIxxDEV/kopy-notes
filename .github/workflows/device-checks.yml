name: Device interaction checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=playwright.devices.config.ts
        env:
          KOPY_DEVICE_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-failure-${{ matrix.browser }}
          path: test-results
          retention-days: 7
