name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-privacy.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: kopy-notes-web
          path: dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: kopy-notes-windows-unsigned-test
          path: release/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run android:add && npm run android:sync
      - run: node scripts/apply-native-branding.mjs
      - run: node scripts/android-permissions.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kopy-notes-android-debug-test
          path: android/app/build/outputs/apk/debug/*.apk
