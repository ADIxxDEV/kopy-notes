name: Create prerelease
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci && npm test && npm run build
      - run: node scripts/check-privacy.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: zip -r kopy-notes-web.zip dist docs LICENSE README.md THIRD_PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: kopy-notes-web.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci && npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-unsigned
          path: release/*.exe
  android:
    runs-on: ubuntu-latest
    env:
      KOPY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KOPY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KOPY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KOPY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KOPY_KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run android:add && npm run android:sync
      - run: node scripts/apply-native-branding.mjs
      - run: node scripts/android-permissions.mjs
      - run: node scripts/android-signing.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-signed
          path: android/app/build/outputs/apk/release/*.apk
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
          body: 'Preview release. Windows installer is unsigned. Review device validation and release notes before publishing. Android uses the configured stable release key.'
