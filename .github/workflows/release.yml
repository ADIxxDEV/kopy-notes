name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device-checks:
    uses: ./.github/workflows/device-checks.yml
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      development: ${{ steps.metadata.outputs.development }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-release.mjs
      - run: node --test scripts/release-metadata.test.mjs
      - id: metadata
        run: node scripts/release-metadata.mjs
  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm audit --audit-level=high && npm test && npm run build
      - run: node scripts/check-privacy.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: zip -r kopy-notes-${{ needs.prepare.outputs.version }}-web.zip dist docs LICENSE README.md THIRD_PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: kopy-notes-*-web.zip
          if-no-files-found: error
  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Label unsigned installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          Move-Item -LiteralPath $installers[0].FullName -Destination 'release/kopy-notes-${{ needs.prepare.outputs.version }}-windows-unsigned.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-unsigned
          path: release/*-windows-unsigned.exe
          if-no-files-found: error
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run android:add && npm run android:sync
      - run: node scripts/apply-native-branding.mjs
      - run: node scripts/android-permissions.mjs
      - name: Configure stable Android signing
        if: needs.prepare.outputs.development != 'true'
        env:
          KOPY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KOPY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOPY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOPY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KOPY_KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
        run: node scripts/android-signing.mjs
      - name: Build development debug APK
        if: needs.prepare.outputs.development == 'true'
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/kopy-notes-${{ needs.prepare.outputs.version }}-android-debug.apk
      - name: Build stable signed APK
        if: needs.prepare.outputs.development != 'true'
        env:
          KOPY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOPY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOPY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KOPY_KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease)
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/kopy-notes-${{ needs.prepare.outputs.version }}-android-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
  publish:
    needs: [prepare, web, windows, android, device-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - run: node scripts/release-metadata.mjs artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kopy Notes ${{ github.ref_name }}
          draft: ${{ needs.prepare.outputs.development != 'true' }}
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body_path: release-notes.md
